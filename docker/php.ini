; Production settings, loaded on top of php.ini-production.

; A 4096 x 4096 profile photo, the largest the API accepts, takes about 70 MB once decoded.
memory_limit = 256M

; Profile photos are at most 2 MB. The margin keeps PHP from rejecting an upload before Laravel validates it.
upload_max_filesize = 5M
post_max_size = 6M

expose_php = Off

; The code in the image never changes, so cached scripts are not checked again.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.max_accelerated_files = 20000
