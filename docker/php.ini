; Production settings, loaded on top of php.ini-production.

; A 4096 x 4096 photo, the largest the API accepts, takes about 70 MB once decoded.
memory_limit = 256M

; Memory photos are at most 10 MB and profile photos 2 MB. The margin keeps PHP
; from rejecting an upload before Laravel validates it. Laravel answers 413 to
; a body above post_max_size.
upload_max_filesize = 12M
post_max_size = 16M

expose_php = Off

; The code in the image never changes, so cached scripts are not checked again.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.max_accelerated_files = 20000
